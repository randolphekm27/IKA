<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Bordure extérieure -->
  <rect x="1" y="1" width="38" height="38" rx="4" ry="4"
        stroke="#000000" stroke-width="3" fill="white"/>
  <!-- Ligne 1 : 4 carrés pleins -->
  <rect x="6"  y="6"  width="6" height="6" rx="1" fill="#000000"/>
  <rect x="14" y="6"  width="6" height="6" rx="1" fill="#000000"/>
  <rect x="22" y="6"  width="6" height="6" rx="1" fill="#000000"/>
  <rect x="30" y="6"  width="6" height="6" rx="1" fill="#000000"/>
  <!-- Ligne 2 : col 1 et col 3 pleins, col 2 et col 4 vides -->
  <rect x="6"  y="14" width="6" height="6" rx="1" fill="#000000"/>
  <rect x="22" y="14" width="6" height="6" rx="1" fill="#000000"/>
  <!-- Ligne 3 : 4 carrés pleins -->
  <rect x="6"  y="22" width="6" height="6" rx="1" fill="#000000"/>
  <rect x="14" y="22" width="6" height="6" rx="1" fill="#000000"/>
  <rect x="22" y="22" width="6" height="6" rx="1" fill="#000000"/>
  <rect x="30" y="22" width="6" height="6" rx="1" fill="#000000"/>
  <!-- Ligne 4 : col 1 et col 3 pleins, col 2 et col 4 vides -->
  <rect x="6"  y="30" width="6" height="6" rx="1" fill="#000000"/>
  <rect x="22" y="30" width="6" height="6" rx="1" fill="#000000"/>
</svg>
